  Diorama: a live 3-D miniature of the drive, from what the driving model sees.
  One page, two sources (the Mac and iPhone apps draw the same scene natively, DioramaScene.swift):
    live    served by jetlink-server at /diorama/, fed by /diorama/events
    drive   ?drive=drive.diorama&footage=footage.mp4: a recorded drive (python -m diorama view) beside its footage
  diorama-camera.json beside the page, when there is one, sets each view's camera; ?camera=setup (python -m diorama
  camera) sets it with the pointer, one view at a time, over a still scene of its own, and posts it back to save.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diorama</title>
<style>
  :root {
    --bg: #0f1012; --panel: #18191c; --line: #2a2c31; --text: #ececee; --dim: #9a9ca3; --accent: #3884ff; --bad: #ff5a52; --ok: #46c86e;
    color-scheme: dark;
  }
  :root[data-theme="light"] { --bg: #f3f3f5; --panel: #ffffff; --line: #dcdde1; --text: #17181b; --dim: #62646b; color-scheme: light; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f3f3f5; --panel: #ffffff; --line: #dcdde1; --text: #17181b; --dim: #62646b; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: 0.02em; }
  header .src { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  header .spacer { flex: 1; }
  header a { color: var(--dim); text-decoration: none; font-size: 13px; }
  main { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
  main.side { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 760px) { main.side { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
  .pane { position: relative; min-height: 0; min-width: 0; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; left: 14px; top: 14px; padding: 12px 34px 12px 16px; border-radius: 12px; background: rgba(22, 23, 26, 0.86);
    color: #f2f2f4; min-width: 150px; pointer-events: none; }
  .hud .speed { font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .hud .unit { font-size: 12px; color: #a9abb1; letter-spacing: 0.08em; }
  .hud .lead, .hud .mode { font-size: 12px; color: #c4c6cb; margin-top: 6px; }
  .hud .mode { color: #8d9097; letter-spacing: 0.06em; white-space: nowrap; }  /* the view and why, clear of the accel bar */
  .hud .accel { position: absolute; right: 14px; top: 14px; bottom: 14px; width: 6px; border-radius: 3px; background: #3b3d42; }
  .hud .accel i { position: absolute; left: 0; right: 0; border-radius: 3px; }
  .waiting { position: absolute; inset: 0; display: grid; place-items: center; color: #b9bbc1; font-size: 15px; text-align: center;
    padding: 24px; background: rgba(15, 16, 18, 0.6); }
  .waiting[hidden] { display: none; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  .stat { display: flex; flex-direction: column; min-width: 92px; }
  .stat b { font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat b.over { color: var(--bad); }
  .stat.note { flex: 1 1 240px; min-width: 0; }
  .stat.note b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat.note b.off { color: var(--bad); }
  .debug { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); cursor: pointer; user-select: none; }
  .debug[hidden] { display: none; }
  .inputview { position: absolute; right: 14px; bottom: 14px; width: min(46%, 512px); border-radius: 8px; overflow: hidden;
    background: #000; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35); pointer-events: none; }
  .inputview[hidden] { display: none; }
  .inputview canvas { width: 100%; height: auto; aspect-ratio: 2 / 1; display: block; image-rendering: pixelated; }
  .inputview span { display: block; padding: 3px 8px; font-size: 11px; color: #ddd; background: #000;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .transport { display: flex; align-items: center; gap: 10px; flex: 1 1 320px; min-width: 0; }
  .transport input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; white-space: nowrap; }
  .error { padding: 24px; color: var(--bad); }
  canvas.tuning { touch-action: none; cursor: grab; }
  canvas.tuning:active { cursor: grabbing; }
  .camset { position: absolute; right: 14px; top: 14px; width: 260px; max-width: calc(100% - 28px); padding: 12px 14px; border-radius: 12px;
    background: rgba(22, 23, 26, 0.9); color: #f2f2f4; display: flex; flex-direction: column; gap: 10px; }
  .camset button { color: #f2f2f4; border-color: #44464c; }
  .camset .views { display: flex; }
  .camset .views button { flex: 1; border-radius: 0; }
  .camset .views button:first-child { border-radius: 8px 0 0 8px; }
  .camset .views button:last-child { border-radius: 0 8px 8px 0; border-left: none; }
  .camset .views button.on { background: var(--accent); border-color: var(--accent); }
  .camset dl { display: flex; justify-content: space-between; margin: 0; }
  .camset dt { font-size: 11px; color: #a9abb1; text-transform: uppercase; letter-spacing: 0.06em; }
  .camset dd { margin: 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .camset .row { display: flex; gap: 8px; }
  .camset .row button { flex: 1; }
  .camset .hint { margin: 0; font-size: 12px; color: #a9abb1; }
  .camset .hint.bad { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Diorama</h1>
  <div class="src" id="src"></div>
  <div class="spacer"></div>
  <a id="back" href="../" hidden>Status</a>
</header>
<main id="main">
  <div class="pane" id="footagePane" hidden><video id="footage" muted playsinline preload="auto"></video></div>
  <div class="pane" id="scenePane">
    <canvas id="scene"></canvas>
    <div class="hud" id="hud">
      <div class="accel"><i id="accel"></i></div>
      <div class="speed" id="speed">–</div>
      <div class="unit">MPH</div>
      <div class="lead" id="lead"></div>
      <div class="mode" id="mode"></div>
    </div>
    <div class="inputview" id="inputView" hidden><canvas id="inputCanvas" width="512" height="256"></canvas><span id="inputLabel"></span></div>
    <div class="waiting" id="waiting">Loading…</div>
    <div class="camset" id="camset" hidden>
      <div class="views"><button id="camRoad">Road view</button><button id="camBird">Bird's-eye</button></div>
      <dl>
        <div><dt>Zoom</dt><dd id="camZoom"></dd></div>
        <div><dt>Pitch</dt><dd id="camPitch"></dd></div>
        <div><dt>Forward</dt><dd id="camForward"></dd></div>
      </dl>
      <div class="row"><button id="camReset">Reset view</button><button id="camSave">Save</button></div>
      <p class="hint">Zoom: pinch, or a mouse wheel. Pitch: drag. Forward: two fingers, or drag with the right button; down goes forward.</p>
      <p class="hint" id="camStatus"></p>
    </div>
  </div>
</main>
<footer>
  <div class="stat"><b id="modelMs">–</b><span>Driving model</span></div>
  <div class="stat"><b id="modelHz">–</b><span>Frames</span></div>
  <div class="stat"><b id="segMs">–</b><span>Segmentation</span></div>
  <div class="stat"><b id="segHz">–</b><span>Perception</span></div>
  <div class="stat note" id="modelsNote" hidden><b id="modelsState"></b><span>Models</span></div>
  <div class="stat note" id="cameraNote" hidden><b id="cameraState" class="off"></b><span>Camera</span></div>
  <label class="debug" id="inputToggle" hidden title="The frame the models see: the narrow camera, warped to 512×256"><input type="checkbox" id="showInput"> Model input</label>
  <div class="transport" id="transport" hidden>
    <button id="play">Play</button>
    <input type="range" id="seek" min="0" max="1" step="0.05" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
</footer>
<script src="diorama-engine.js"></script>
<script src="diorama-render.js"></script>
<script>
(function () {
  'use strict';
  const E = DioramaEngine, $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
  const engine = new E.Engine();
  let renderer = null, lastData = 0, frameTimes = [];

  const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const median = (a) => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; };

  function wait(text) { $('waiting').textContent = text; $('waiting').hidden = !text; }

  function hud(state) {
    if (!state) return;
    $('speed').textContent = Math.round(state.hud.v * E.MPH);
    $('lead').textContent = state.hud.lead != null ? `lead ${Math.round(state.hud.lead)} m` : '';
    const held = renderer && renderer.fixedView != null, s = held ? renderer.fixedView : state.view;
    const why = state.viewWhy && !held ? ` · ${state.viewWhy.toUpperCase()}` : '';
    $('mode').textContent = (s < 0.02 ? 'ROAD VIEW' : s > 0.98 ? "BIRD'S-EYE" : `PANNING ${Math.round(s * 100)}%`) + why;
    const a = E.clamp(state.hud.a, -3.2, 3.2), bar = $('accel');
    bar.style.top = `${50 - Math.max(a, 0) / 3.2 * 50}%`;
    bar.style.bottom = `${50 + Math.min(a, 0) / 3.2 * 50}%`;
    bar.style.background = a > 0.2 ? '#5ad27a' : a < -0.5 ? '#ff5a52' : '#c8c8c8';
  }

  function stats() {
    const t = engine.timing, m = median(t.model), sg = median(t.seg);
    const ms = (v) => (v == null ? '–' : `${v.toFixed(1)} ms`);
    $('modelMs').textContent = ms(m);
    $('modelMs').classList.toggle('over', m != null && m > 50);
    $('segMs').textContent = ms(sg);
    // frames a second as they arrive (live), or the drive's own rate
    const now = performance.now();
    frameTimes = frameTimes.filter((x) => now - x < 2000);
    $('modelHz').textContent = live ? `${(frameTimes.length / 2).toFixed(0)} Hz` : '20 Hz';
    const sf = t.segFrames;
    $('segHz').textContent = sf.length > 1 ? `${(E.FPS * (sf.length - 1) / Math.max(sf[sf.length - 1] - sf[0], 1)).toFixed(1)} Hz` : '–';
  }

  function frame() {
    if (source.tick) source.tick();
    if (renderer) renderer.draw(...(preview ? [preview.state, preview.engine] : [engine.state, engine]));
    if (!preview) hud(engine.state);
    requestAnimationFrame(frame);
  }

  function b64(s) {
    const bin = atob(s), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  function take(u8) {
    const msg = E.decode(u8);
    engine.push(msg);
    if (msg.kind === 'D') { lastData = performance.now(); frameTimes.push(lastData); }
    if (msg.kind === 'M' && msg.meta.source) $('src').textContent = msg.meta.source.route ? `${msg.meta.source.route}` : '';
    if (msg.kind === 'T') models(msg.text);
    if ($('showInput').checked && (msg.kind === 'I' || msg.kind === 'S')) inputMessage(msg);
  }

  // ---- debug: the frame the models see, the packed narrow frame unpacked to 512x256 RGB (BT.601, video range),
  // with what the segmentation made of it tinted over it, each thing outlined and named
  const SEG_TINT = { 1: [128, 64, 255], 2: [255, 214, 10], 3: [255, 255, 255], 4: [255, 140, 0], 5: [255, 92, 170] };
  const THING_TINT = { car: [56, 132, 255], truck: [0, 200, 220], bus: [0, 200, 220], person: [255, 64, 64], bicycle: [70, 210, 110], motorcycle: [70, 210, 110] };
  const images = [];  // the last few frames as RGB, for the segmentation that comes after its frame
  let lastSeg = null, shown = -1;

  function unpack(msg) {
    const { w, h, packed } = msg, W = 2 * w, H = 2 * h, plane = w * h;
    const image = new ImageData(W, H), px = image.data;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        // the four Y planes are Y[0::2, 0::2], Y[1::2, 0::2], Y[0::2, 1::2], Y[1::2, 1::2]
        const at = (y >> 1) * w + (x >> 1), c = (packed[((y & 1) + 2 * (x & 1)) * plane + at] - 16) * 1.164;
        const u = packed[4 * plane + at] - 128, v = packed[5 * plane + at] - 128, o = 4 * (y * W + x);
        px[o] = c + 1.596 * v; px[o + 1] = c - 0.391 * u - 0.813 * v; px[o + 2] = c + 2.018 * u; px[o + 3] = 255;
      }
    }
    return image;
  }

  function inputMessage(msg) {
    if (msg.kind === 'I') {
      images.push({ frame: msg.frame, image: unpack(msg) });
      if (images.length > 6) images.shift();
    } else lastSeg = msg;
    if (!images.length) return;
    // the frame the newest segmentation is of, which comes a little after the frame itself; the newest frame
    // bare while the models are not segmenting (preparing, paused, off)
    const segImage = lastSeg && images.find((i) => i.frame === lastSeg.frame), newest = images[images.length - 1];
    if (segImage) {
      if (segImage.frame !== shown) drawInput(segImage, lastSeg);
    } else if (!lastSeg || newest.frame - lastSeg.frame >= 8) drawInput(newest, null);
  }

  function drawInput({ frame, image }, seg) {
    const ctx = $('inputCanvas').getContext('2d'), W = image.width, H = image.height, meta = engine.meta;
    shown = frame;
    ctx.putImageData(image, 0, 0);
    const notes = [`frame ${frame}`];
    if (seg && meta && meta.seg) {
      const info = E.readSeg(seg, meta), { w, h, qmap, qThing, cls } = info, sx = W / w, sy = H / h;
      const tint = new ImageData(w, h), px = tint.data;
      for (let i = 0; i < w * h; i++) {
        const q = qmap[i];
        const c = q === 255 ? null : qThing[q] ? THING_TINT[qThing[q]] || THING_TINT.car : SEG_TINT[cls[i]];
        if (!c) continue;
        // a thing's edge (another query beside it) opaque, its inside and the road classes see-through
        const x = i % w, edge = qThing[q] && ((x > 0 && qmap[i - 1] !== q) || (x < w - 1 && qmap[i + 1] !== q) || (i >= w && qmap[i - w] !== q) || (i < w * (h - 1) && qmap[i + w] !== q));
        px.set(c, 4 * i); px[4 * i + 3] = edge ? 255 : qThing[q] ? 110 : 90;
      }
      const off = new OffscreenCanvas(w, h);
      off.getContext('2d').putImageData(tint, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, W, H);
      // each thing's name and score, above it
      const tops = new Map(), area = new Uint32Array(256);
      for (let i = 0; i < w * h; i++) {
        const q = qmap[i];
        if (q === 255 || !qThing[q]) continue;
        area[q]++;
        if (!tops.has(q)) tops.set(q, i);
      }
      ctx.font = '600 10px system-ui, sans-serif';
      for (const [q, i] of tops) {
        if (area[q] < 6) continue;
        label(ctx, `${qThing[q]} ${(seg.score[q] / 255).toFixed(2)}`, (i % w) * sx, Math.floor(i / w) * sy, THING_TINT[qThing[q]] || THING_TINT.car, 'above');
      }
      notes.push(`seg ${seg.ms.toFixed(0)} ms`);
    }
    $('inputLabel').textContent = `model input · ${W}×${H} · ${notes.join(' · ')}`;
  }

  function label(ctx, text, x, y, rgb, where) {
    const tw = ctx.measureText(text).width + 6, top = where === 'above' ? Math.max(y - 13, 0) : Math.min(y, 256 - 13);
    const left = Math.min(Math.max(x, 0), 512 - tw);
    ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.85)`;
    ctx.fillRect(left, top, tw, 13);
    ctx.fillStyle = '#000';
    ctx.fillText(text, left + 3, top + 10);
  }

  // the toggle: remembered here, and the source asks the server for the frames only while it is on
  function inputToggle(ask) {
    let on = false;
    try { on = localStorage.getItem('diorama.input') === '1'; } catch (e) { /* storage off */ }
    $('showInput').checked = on;
    $('inputView').hidden = !on;
    $('inputToggle').hidden = false;
    $('showInput').onchange = () => {
      const now = $('showInput').checked;
      try { localStorage.setItem('diorama.input', now ? '1' : '0'); } catch (e) { /* storage off */ }
      $('inputView').hidden = !now;
      ask(now);
    };
    return on;
  }

  // the server's models, when they are not simply running: preparing, paused, or off and why
  function models(text) {
    const show = text && text !== 'running' && text !== 'idle', b = $('modelsState');
    $('modelsNote').hidden = !show;
    if (!show) return;
    b.textContent = text[0].toUpperCase() + text.slice(1);
    b.title = b.textContent;
    b.classList.toggle('off', text.startsWith('off'));
  }

  // ---- live: the server's event stream
  function liveSource() {
    $('back').hidden = false;
    $('src').textContent = 'Live from the comma';
    wait('Waiting for the comma…');
    let es = null, input = false;
    const open = () => {
      es = new EventSource(input ? 'events/frames' : 'events');
      es.onmessage = (e) => take(b64(e.data));
      es.addEventListener('off', (e) => wait(e.data || 'Diorama is off on this server.'));
      es.onerror = () => { es.close(); wait('Reconnecting…'); setTimeout(open, 2000); };
    };
    input = inputToggle((on) => { input = on; es.close(); open(); });
    open();
    return { tick() { if (performance.now() - lastData < 2000) wait(''); else if ($('waiting').hidden) wait('Waiting for the comma…'); } };
  }

  // ---- a recorded drive, kept in step with its footage
  async function driveSource(url, footageUrl) {
    $('transport').hidden = false;
    wait('Loading the drive…');
    const buf = await (await fetch(url)).arrayBuffer();
    const msgs = [...E.readFile(buf)];
    const meta = msgs.find((m) => m.kind === 'M');
    engine.push(meta);
    $('src').textContent = meta.meta.source ? `${meta.meta.source.route}, from ${fmtTime(meta.meta.source.start / E.FPS)}` : url;
    const frames = [];  // frame -> index of its drive message
    msgs.forEach((m, i) => { if (m.kind === 'D') frames[m.frame] = i; });
    const last = frames.length - 1, duration = (last + 1) / E.FPS;
    let at = 0;  // the next message to push
    let clock = 0, playing = false, lastNow = null;
    const video = footageUrl ? $('footage') : null;
    if (video) {
      $('main').classList.add('side');
      $('footagePane').hidden = false;
      video.src = footageUrl;
      video.addEventListener('play', () => ($('play').textContent = 'Pause'));
      video.addEventListener('pause', () => ($('play').textContent = 'Play'));
    }
    $('seek').max = duration;
    const now = () => (video ? video.currentTime : clock);
    const replay = (target) => {
      // back to a frame: start over a little before it, so the road map has history
      const from = Math.max(0, target - 200);
      engine.reset();
      at = frames[from] !== undefined ? frames[from] : 0;
    };
    $('play').onclick = () => {
      if (video) { video.paused ? video.play() : video.pause(); return; }
      playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play';
    };
    $('seek').oninput = () => { const t = Number($('seek').value); if (video) video.currentTime = t; else clock = t; };
    document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('play').click(); } });
    wait('');
    return {
      tick() {
        if (!video) {
          const t = performance.now();
          if (playing && lastNow !== null) clock = Math.min(clock + (t - lastNow) / 1000, duration);
          lastNow = t;
        }
        const target = Math.min(Math.floor(now() * E.FPS), last);
        if (engine.frame > target || target - engine.frame > 200) replay(target);
        while (at < msgs.length) {
          const m = msgs[at];
          if (m.kind === 'D' && m.frame > target) break;
          engine.push(m);
          at++;
        }
        $('seek').value = now();
        $('time').textContent = `${fmtTime(now())} / ${fmtTime(duration)}`;
      },
    };
  }

  // ---- the camera: diorama-camera.json beside the page, where the viewer or the server has one, over the renderer's own
  async function loadCamera() {
    let res;
    try { res = await fetch('diorama-camera.json', { cache: 'no-store' }); } catch (e) { return; }
    if (res.status === 404) return;
    try {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      renderer.views = DioramaRender.readCamera(await res.json());
    } catch (e) {
      $('cameraState').textContent = $('cameraState').title = `diorama-camera.json ignored: ${e.message}`;
      $('cameraNote').hidden = false;
    }
  }

  // ---- setting it: one view at a time, held whatever the drive asks, with the pointer, then posted back to save.
  // Zoom is a pinch (a trackpad's comes as a wheel with ctrl) or a mouse wheel, pitch a drag, forward two fingers (a
  // trackpad's come as a wheel) or a drag with the right button.
  function cameraSetup() {
    const canvas = $('scene');
    let view = 'road', saved = JSON.stringify(renderer.views);
    $('camset').hidden = false;
    canvas.classList.add('tuning');
    const show = (note) => {
      renderer.fixedView = view === 'road' ? 0 : 1;
      const n = renderer.views[view];
      $('camZoom').textContent = n.zoom.toFixed(2);
      $('camPitch').textContent = `${n.pitch.toFixed(1)}°`;
      $('camForward').textContent = `${n.forward < 0 ? '−' : '+'}${Math.abs(n.forward).toFixed(1)} m`;
      $('camRoad').classList.toggle('on', view === 'road');
      $('camBird').classList.toggle('on', view === 'bird');
      $('camStatus').textContent = note || (JSON.stringify(renderer.views) === saved ? '' : 'Not saved');
      $('camStatus').classList.remove('bad');
    };
    const zoomBy = (r) => { DioramaRender.zoomView(renderer.views, view, r); show(); };
    const pitchBy = (dy) => { renderer.views[view].pitch += dy * 0.25; show(); };  // down shows it from higher, as if dragging the world
    const forwardBy = (dy) => { DioramaRender.moveForward(renderer.views, view, dy); show(); };  // down pulls the road back under it

    // a mouse's wheel turns in notches (lines, or 120ths of the old wheelDelta) and only up and down; a trackpad scrolls
    // by the pixel, and once a scroll looks like one the rest of it is
    let trackpadAt = -Infinity;
    const mouseWheel = (e) => {
      if (e.deltaMode !== 0) return true;
      if (e.deltaX !== 0 || !e.wheelDeltaY || e.wheelDeltaY % 120 !== 0) trackpadAt = e.timeStamp;
      return e.timeStamp - trackpadAt > 300;
    };
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const px = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
      if (e.ctrlKey) zoomBy(Math.exp(-px * 0.01));
      else if (mouseWheel(e)) zoomBy(Math.exp(-px * 0.0015));
      else forwardBy(-px);  // fingers down scroll up, and go forward
    }, { passive: false });

    // touches: one drags the pitch, two pinch the zoom and move forward together; a mouse's left button drags the
    // pitch, its right forward
    const at = new Map();
    let pinched = false;  // two fingers were down: the one left does nothing until it lifts
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0 && e.button !== 2) return;
      canvas.setPointerCapture(e.pointerId);
      at.set(e.pointerId, [e.clientX, e.clientY]);
      if (at.size > 1) pinched = true;
    });
    canvas.addEventListener('pointermove', (e) => {
      const was = at.get(e.pointerId);
      if (!was) return;
      const now = [e.clientX, e.clientY], dy = now[1] - was[1];
      at.set(e.pointerId, now);
      if (e.pointerType === 'touch' && at.size > 1) {
        const other = [...at].find(([id]) => id !== e.pointerId)[1];
        const before = Math.hypot(was[0] - other[0], was[1] - other[1]), after = Math.hypot(now[0] - other[0], now[1] - other[1]);
        if (before > 0) zoomBy(after / before);
        // the middle of the two, pulling the road along under the fingers where there is road there
        const box = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1, hgt = renderer.hgt ?? 1.22;
        const c = renderer.camera(renderer.fixedView, hgt, canvas.width, canvas.height);
        const mid = [(was[0] + other[0]) / 2 - box.left, (was[1] + other[1]) / 2 - box.top];
        const m = DioramaRender.forwardFollowing(c, hgt, mid[0] * dpr, mid[1] * dpr, dy / 2 * dpr);
        if (m === null) forwardBy(dy / 2);
        else { DioramaRender.moveForwardBy(renderer.views, view, m); show(); }
      } else if (e.pointerType === 'mouse' && e.buttons & 2) forwardBy(dy);
      else if (!pinched) pitchBy(dy);
    });
    const up = (e) => { at.delete(e.pointerId); if (!at.size) pinched = false; };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);

    $('camRoad').onclick = () => { view = 'road'; show(); };
    $('camBird').onclick = () => { view = 'bird'; show(); };
    $('camReset').onclick = () => { renderer.views[view] = DioramaRender.defaultCamera()[view]; show(); };
    $('camSave').onclick = async () => {
      const file = {};
      for (const [k, n] of Object.entries(renderer.views)) file[k] = { zoom: +n.zoom.toFixed(3), pitch: +n.pitch.toFixed(2), forward: +n.forward.toFixed(2), rise: +n.rise.toFixed(2), shift: +n.shift.toFixed(4) };
      try {
        const res = await fetch('diorama-camera.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(file) });
        const text = (await res.text()).trim();
        if (!res.ok) throw new Error(text || `HTTP ${res.status}`);
        renderer.views = DioramaRender.readCamera(file);
        saved = JSON.stringify(renderer.views);
        show(`Saved to ${text}`);
        $('cameraNote').hidden = true;
      } catch (e) {
        $('camStatus').textContent = `Not saved: ${e.message}`;
        $('camStatus').classList.add('bad');
      }
    };
    show();
  }

  const setup = params.get('camera') === 'setup', live = !setup && !params.get('drive');
  let source = { tick: null }, preview = null;
  (async () => {
    try {
      const assets = await (await fetch('diorama-assets.bin')).arrayBuffer();
      renderer = new DioramaRender.Renderer($('scene'), assets, theme);
    } catch (e) {
      $('main').innerHTML = `<div class="error">Diorama cannot draw here: ${e.message}</div>`;
      return;
    }
    await loadCamera();
    if (setup) {
      // no drive and no footage: the camera is set over a scene of its own
      preview = DioramaRender.previewScene();
      $('hud').hidden = true;
      document.querySelector('footer').hidden = true;
      $('src').textContent = 'Camera setup';
      wait('');
      cameraSetup();
    } else if (params.get('drive')) source = await driveSource(params.get('drive'), params.get('footage'));
    else source = liveSource();
    setInterval(stats, 500);
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
